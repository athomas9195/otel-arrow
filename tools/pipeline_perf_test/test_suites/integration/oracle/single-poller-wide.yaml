# Oracle receiver byte-throughput benchmark with one poller and 64 KiB rows.
name: Oracle Receiver - Single Poller - 64 KiB Rows
components:
  df-engine:
    deployment:
      docker:
        image: df_engine_oracle_benchmark:latest
        network: testbed
        cpuset_cpus: "0"
        ports:
          - "127.0.0.1:8086:8080"
        environment:
          ORACLE_CONNECT_STRING: //10.50.1.4:1521/ORCLPDB1
        volumes:
          - >-
            test_suites/integration/configs/oracle/config.rendered.yaml:/app/config.yaml:ro
          - >-
            test_suites/integration/configs/oracle/secrets:/run/oracle-secrets:ro
          - >-
            test_suites/integration/configs/oracle/checkpoints:/var/lib/otel-arrow/oracle:rw
        command:
          - "--config"
          - "/app/config.yaml"
          - "--core-id-range"
          - "0-0"
          - "--http-admin-bind"
          - "0.0.0.0:8080"
    monitoring:
      docker_component:
        allocated_cores: 1
        interval: 1
      prometheus:
        endpoint: >-
          http://localhost:8086/api/v1/telemetry/metrics?format=prometheus&reset=false
        interval: 1

tests:
  - name: Oracle 64 KiB wide-row backlog
    from_template:
      path: >-
        test_suites/integration/templates/test_steps/oracle-single-poller-steps-docker.yaml
      variables:
        result_dir: oracle_single_poller_wide
        engine_config_template: >-
          ./test_suites/integration/templates/configs/engine/oracle/single-poller-wide.yaml.j2
        warmup_interval: 30
        observation_interval: 300
        drain_timeout_secs: 300
        poll_interval: 1ms
        fetch_size: 3000
        max_rows_per_poll: 3000
        max_batch_bytes: 256 MiB
        max_normalized_bytes: 256 MiB
        query_timeout: 5m
