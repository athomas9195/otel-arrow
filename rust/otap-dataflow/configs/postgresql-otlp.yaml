# Development-only PostgreSQL 15 fixture: database transport is unencrypted.
# Build df_engine with postgresql,otlp,crypto-ring. The crypto feature is for exporters.
version: otel_dataflow/v1
policies:
  resources:
    core_allocation:
      type: core_count
      count: 1
groups:
  database:
    pipelines:
      pg_fixture:
        type: otap
        policies:
          channel_capacity:
            control:
              node: 16
              pipeline: 16
            pdata: 1
        extensions:
          pg-credentials:
            type: urn:otel:extension:flat_file_user_pass_auth
            config:
              username: collector
              password_secret_file: '${env:PG_PASSWORD_FILE:-/run/secrets/postgresql/password}'
              password_secret_file_refresh: 1m
        nodes:
          pg:
            type: urn:otel:receiver:postgresql
            capabilities:
              basic_auth_provider: pg-credentials
            config:
              source_id: orders-audit
              connection:
                host: '${env:PG_HOST:-localhost}'
                port: 5432
                database: receiver_fixture
              query:
                statement: |
                  SELECT e.event_ts, e.event_id, e.actor, e.amount, e.payload
                  FROM public.receiver_events AS e
                  WHERE ((e.event_ts > :last_timestamp) OR
                          (e.event_ts = :last_timestamp AND e.event_id > :last_tie_breaker))
                  ORDER BY e.event_ts ASC, e.event_id ASC
                interval: 1m
                result_schema:
                  - {name: event_ts, source_type: timestamptz, nullable: false, type_modifier: 6}
                  - {name: event_id, source_type: int8, nullable: false, type_modifier: -1}
                  - {name: actor, source_type: text, nullable: false, type_modifier: -1}
                  - {name: amount, source_type: numeric, nullable: false, type_modifier: -1}
                  - {name: payload, source_type: jsonb, nullable: false, type_modifier: -1}
                output:
                  timestamp_column: event_ts
              watermark:
                mode: composite
                timestamp:
                  column: event_ts
                  bind: last_timestamp
                  initial: "2026-10-05T00:00:00.000000Z"
                  timezone: UTC
                tie_breaker:
                  column: event_id
                  bind: last_tie_breaker
                  initial: 0
              checkpoint:
                directory: '${engine.state_dir}/postgresql'
                on_nack: rewind
                on_permanent_nack: pause
                nack_backoff: 1s
                max_consecutive_failures: 5
          capture:
            type: urn:otel:exporter:otlp_grpc
            config:
              grpc_endpoint: "http://127.0.0.1:4317"
              timeout: 5s
              max_in_flight: 1
              num_connections: 1
        connections:
          - from: pg
            to: capture
